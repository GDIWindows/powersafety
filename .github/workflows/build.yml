name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip
        pip install buildozer cython
        
        mkdir -p fonts
        wget -O fonts/NotoSansCJK.ttc https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Chinese%20\(Simplified\)/NotoSansCJKsc-Regular.otf || true
        
        cat > buildozer.spec << 'EOF'
[app]
title = 电力安全题库
package.name = powersafety
package.domain = org.example
version = 1.0.0
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf,ttc,otf,xml,json
source.main = main.py
android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,CAMERA
android.api = 31
android.minapi = 21
android.sdk = 33
android.ndk = 28c
android.ndk_api = 21
android.archs = armeabi-v7a
requirements = python3,kivy==2.1.0,pillow,pytesseract,requests,android,plyer
android.allow_backup = True
android.app_name = 电力安全题库
android.display_name = 电力安全题库
fullscreen = 0
log_level = 2
android.accept_sdk_license = True

[buildozer]
log_level = 2
warn_on_root = 1
EOF
        
        sed -i 's|C:/Windows/Fonts/simsun.ttc|fonts/NotoSansCJK.ttc|g' main.py || true
        buildozer android debug
      shell: bash
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: powersafety-apk
        path: bin/*.apk
