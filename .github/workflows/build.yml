name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install
      run: |
        pip install --upgrade pip
        pip install buildozer cython
    
    - name: Build
      run: |
        cat > buildozer.spec << 'EOF'
[app]
title = 电力安全题库
package.name = powersafety
package.domain = org.example
version = 1.0.0
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf,ttc,otf,xml,json
source.main = main.py
android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,CAMERA
android.api = 29
android.minapi = 21
android.sdk = 30
android.ndk = 23b
android.archs = armeabi-v7a
requirements = python3,kivy
android.allow_backup = True
android.app_name = 电力安全题库
android.display_name = 电力安全题库
fullscreen = 0
log_level = 2
android.accept_sdk_license = True

[buildozer]
log_level = 2
warn_on_root = 1
EOF
        buildozer android debug
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
