name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build APK
      run: |
        # 安装依赖
        sudo apt-get update
        sudo apt-get install -y git zip unzip
        pip install --upgrade pip
        pip install buildozer cython
        
        # --- 关键修复开始 ---
        # 1. 手动克隆 python-for-android
        mkdir -p .buildozer/android/platform
        cd .buildozer/android/platform
        git clone --depth 1 https://github.com/kivy/python-for-android.git
        
        # 2. 修改 freetype 下载地址 (替换成多个可靠镜像)
        cd python-for-android
        # 将 savannah.gnu.org 的地址替换为更可靠的地址
        sed -i 's|https://download.savannah.gnu.org/releases/freetype/freetype-.*.tar.gz|https://github.com/freetype/freetype/releases/download/VER-2-13-3/freetype-2.13.3.tar.gz|g' pythonforandroid/recipes/freetype/__init__.py
        
        # 回到工作目录
        cd $GITHUB_WORKSPACE
        # --- 关键修复结束 ---
        
        # 创建字体目录
        mkdir -p fonts
        
        # 创建 buildozer.spec
        echo '[app]' > buildozer.spec
        echo 'title = 电力安全题库' >> buildozer.spec
        echo 'package.name = powersafety' >> buildozer.spec
        echo 'package.domain = org.example' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg,kv,atlas,ttf,ttc,otf,xml,json' >> buildozer.spec
        echo 'source.main = main.py' >> buildozer.spec
        echo 'android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,CAMERA' >> buildozer.spec
        echo 'android.api = 31' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.sdk = 33' >> buildozer.spec
        echo 'android.ndk = 28c' >> buildozer.spec
        echo 'android.ndk_api = 21' >> buildozer.spec
        echo 'android.archs = armeabi-v7a,arm64-v8a' >> buildozer.spec
        echo 'requirements = python3,kivy==2.1.0,pillow,pytesseract,requests,android,plyer' >> buildozer.spec
        echo 'android.allow_backup = True' >> buildozer.spec
        echo 'android.app_name = 电力安全题库' >> buildozer.spec
        echo 'android.display_name = 电力安全题库' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
        echo 'android.accept_sdk_license = True' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
        echo 'warn_on_root = 1' >> buildozer.spec
        
        # 修复字体路径
        sed -i 's|C:/Windows/Fonts/simsun.ttc|fonts/NotoSansCJK.ttc|g' main.py || true
        sed -i 's|C:/Windows/Fonts/msyh.ttc|fonts/NotoSansCJK.ttc|g' main.py || true
        
        # 下载中文字体
        wget -O fonts/NotoSansCJK.ttc https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Chinese%20\(Simplified\)/NotoSansCJKsc-Regular.otf || true
        
        # 开始打包
        buildozer android debug
      shell: bash
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: powersafety-apk
        path: bin/*.apk
        retention-days: 30
