name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip
        pip install buildozer cython
    
    - name: Create fonts directory
      run: |
        mkdir -p fonts
        if [ -f "fonts/NotoSansCJK.ttc" ]; then
          echo "字体文件已存在"
        else
          wget -O fonts/NotoSansCJK.ttc https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Chinese%20\(Simplified\)/NotoSansCJKsc-Regular.otf || true
        fi
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
[app]
title = 电力安全题库
package.name = powersafety
package.domain = org.example
version = 1.0.0
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf,ttc,otf,xml,json
source.main = main.py
android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,CAMERA
android.api = 31
android.minapi = 21
android.sdk = 33
android.ndk = 23b
android.arch = armeabi-v7a,arm64-v8a
requirements = python3,kivy==2.2.1,pillow,pytesseract,requests,android,plyer
android.allow_backup = True
android.app_name = 电力安全题库
android.display_name = 电力安全题库
fullscreen = 0
log_level = 2
android.accept_sdk_license = True
android.gradle_dependencies = 'androidx.appcompat:appcompat:1.3.1'
[buildozer]
log_level = 2
warn_on_root = 1
EOF
    
    - name: Fix font paths in main.py
      run: |
        sed -i 's|C:/Windows/Fonts/simsun.ttc|fonts/NotoSansCJK.ttc|g' main.py || true
        sed -i 's|C:/Windows/Fonts/msyh.ttc|fonts/NotoSansCJK.ttc|g' main.py || true
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: powersafety-apk
        path: bin/*.apk
        retention-days: 30